
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
</head>

<body>

<section>

    <div class="container mt-5 p-5">

        <div class="row">

            <div class="col-md-8 offset-md-2">

                <div class="card shadow p-4">

                    <!-- Header -->
                    <div class="card-header text-center bg-white">
                        <h3 class="fw-bold">Add Product</h3>

                        <!-- Success Message -->
                        <th:block th:if="${session.succMsg}">
                            <p class="text-success fw-bold">
                                [[${session.succMsg}]]
                            </p>

                            <th:block
                                    th:text="${@commonServiceImpl.removeSessionMessage()}">
                            </th:block>
                        </th:block>

                        <!-- Error Message -->
                        <th:block th:if="${session.errorMsg}">
                            <p class="text-danger fw-bold">
                                [[${session.errorMsg}]]
                            </p>

                            <th:block
                                    th:text="${@commonServiceImpl.removeSessionMessage()}">
                            </th:block>
                        </th:block>

                    </div>


                    <!-- Form -->
                    <div class="card-body">

                        <form action="/admin/saveProduct"
                              method="post"
                              enctype="multipart/form-data">


                            <!-- Product Title -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Product Title
                                </label>

                                <input type="text"
                                       name="title"
                                       class="form-control"
                                       placeholder="Enter product title"
                                       required>

                            </div>


                            <!-- Description -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Description
                                </label>

                                <textarea name="description"
                                          class="form-control"
                                          rows="5"
                                          placeholder="Enter product description"
                                          required></textarea>

                            </div>


                            <!-- Category -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Category
                                </label>

                                <select name="category"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        -- Select Category --
                                    </option>

                                    <option th:each="c : ${categories}"
                                            th:value="${c.name}"
                                            th:text="${c.name}">
                                    </option>

                                </select>

                            </div>


                            <!-- Price & Stock -->
                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Price
                                    </label>

                                    <input type="number"
                                           name="price"
                                           class="form-control"
                                           placeholder="Enter price"
                                           min="0"
                                           step="0.01"
                                           required>

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Stock
                                    </label>

                                    <input type="number"
                                           name="stock"
                                           class="form-control"
                                           placeholder="Enter stock quantity"
                                           min="0"
                                           required>

                                </div>

                            </div>


                            <!-- Product Image -->
                            <div class="mb-4">

                                <label class="form-label">
                                    Product Image
                                </label>

                                <input type="file"
                                       name="file"
                                       class="form-control"
                                       accept="image/*">

                                <small class="text-muted">
                                    Upload a product image
                                </small>

                            </div>


                            <!-- Submit Button -->
                            <button type="submit"
                                    class="btn btn-primary w-100">

                                <i class="fa-solid fa-plus me-2"></i>
                                Add Product

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
