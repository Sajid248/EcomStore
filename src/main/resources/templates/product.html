<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}"><body><section>
<div class="shop-search"><div class="container"><div class="row justify-content-center"><div class="col-lg-8 text-center"><h1 class="mb-3">Find something you'll love.</h1><form th:action="@{/products}" method="get"><div class="search-box input-group"><input type="text" class="form-control" name="ch" th:value="${param.ch}" placeholder="Search products or categories..."><button class="btn btn-primary px-4" type="submit"><i class="fa-solid fa-magnifying-glass me-1"></i> Search</button></div></form></div></div></div></div>
<div class="container section-space"><div class="row g-4"><aside class="col-lg-3"><div class="modern-card p-3 filter-card"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="fw-bold mb-0">Categories</h5><a th:href="@{/products}" class="small text-primary text-decoration-none">Clear</a></div><a th:href="@{/products}" th:classappend="${paramValue==''} ? 'active' : ''" class="filter-link">All products</a><a th:each="c:${categories}" th:href="@{/products(category=${c.name})}" th:classappend="${paramValue == c.name} ? 'active' : ''" class="filter-link" th:text="${c.name}"></a></div></aside>
<main class="col-lg-9"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="text-primary fw-bold mb-1">COLLECTION</p><h2 class="section-title mb-0">Products</h2></div><span class="text-secondary" th:text="${totalElements+' products'}"></span></div>
<div class="row product-grid" th:if="${productsSize>0}"><div class="col-6 col-md-4" th:each="p:${products}"><div class="product-card"><a th:href="@{'/product/'+${p.id}}" class="text-decoration-none"><div class="product-image-wrap"><span class="discount-badge" th:if="${p.discount>0}" th:text="${p.discount+'% OFF'}"></span><img class="product-image" th:src="@{'/img/product_img/'+${p.image}}" th:alt="${p.title}"></div><div class="product-body"><div class="product-title text-dark" th:text="${p.title}"></div><div class="mt-2"><span class="price-current"><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> <span th:text="${p.discountPrice}"></span></span><span class="price-old ms-2"><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> <span th:text="${p.price}"></span></span></div></div></a></div></div></div>
<div th:unless="${productsSize>0}" class="modern-card text-center p-5"><i class="fa-solid fa-box-open fa-3x text-secondary mb-3"></i><h4>No products found</h4><p class="text-secondary">Try another search or category.</p><a th:href="@{/products}" class="btn btn-primary">View all products</a></div>
<div class="d-flex justify-content-between align-items-center mt-5" th:if="${productsSize>0}"><small class="text-secondary">Page [[${pageNo+1}]] of [[${totalPages}]]</small><nav><ul class="pagination mb-0"><li class="page-item" th:classappend="${isFirst} ? 'disabled':''"><a class="page-link" th:href="@{/products(pageNo=${pageNo-1},pageSize=${pageSize},category=${paramValue})}">&laquo;</a></li><li th:each="i:${#numbers.sequence(1,totalPages)}" class="page-item" th:classappend="${pageNo+1==i} ? 'active':''"><a class="page-link" th:href="@{/products(pageNo=${i-1},pageSize=${pageSize},category=${paramValue})}" th:text="${i}"></a></li><li class="page-item" th:classappend="${isLast} ? 'disabled':''"><a class="page-link" th:href="@{/products(pageNo=${pageNo+1},pageSize=${pageSize},category=${paramValue})}">&raquo;</a></li></ul></nav></div>
</main></div></div>
</section></body></html>
