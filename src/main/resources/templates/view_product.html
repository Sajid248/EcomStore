<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}"><body><section>
<div class="container section-space"><div class="modern-card p-3 p-md-5">
<div th:if="${session.succMsg}" class="alert alert-success flash">[[${session.succMsg}]]<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block></div><div th:if="${session.errorMsg}" class="alert alert-danger flash">[[${session.errorMsg}]]<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block></div>
<div class="row align-items-center g-5"><div class="col-lg-6"><div class="bg-light rounded-4 d-flex align-items-center justify-content-center p-5" style="min-height:420px"><img class="img-fluid" style="max-height:360px;object-fit:contain" th:src="@{'/img/product_img/'+${product.image}}" th:alt="${product.title}"></div></div>
<div class="col-lg-6"><span class="badge text-bg-light border mb-3" th:text="${product.category}"></span><h1 class="fw-bold display-6" th:text="${product.title}"></h1><p class="text-secondary fs-5" th:text="${product.description}"></p><div class="d-flex align-items-center gap-3 my-4"><span class="price-current fs-3"><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${product.discountPrice}]]</span><span class="price-old" th:if="${product.discount>0}"><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${product.price}]]</span><span class="badge bg-success" th:if="${product.discount>0}" th:text="${product.discount+'% off'}"></span></div>
<div class="row g-3 mb-4"><div class="col-sm-4"><div class="text-center p-3 rounded-3 bg-light"><i class="fas fa-money-bill-wave text-success mb-2"></i><div class="small fw-semibold">Cash on Delivery</div></div></div><div class="col-sm-4"><div class="text-center p-3 rounded-3 bg-light"><i class="fas fa-undo text-danger mb-2"></i><div class="small fw-semibold">7-day return</div></div></div><div class="col-sm-4"><div class="text-center p-3 rounded-3 bg-light"><i class="fas fa-truck text-primary mb-2"></i><div class="small fw-semibold">Fast delivery</div></div></div></div>
<div th:if="${product.stock>0}"><a th:if="${user==null}" th:href="@{/signin}" class="btn btn-primary btn-lg w-100"><i class="fa-solid fa-cart-plus me-2"></i>Sign in to add to cart</a><a th:if="${user!=null}" th:href="@{/user/addCart(pid=${product.id},uid=${user.id})}" class="btn btn-primary btn-lg w-100"><i class="fa-solid fa-cart-plus me-2"></i>Add to cart</a></div><div th:unless="${product.stock>0}"><button class="btn btn-secondary btn-lg w-100" disabled>Out of stock</button></div>
</div></div></div></div>
</section></body></html>
